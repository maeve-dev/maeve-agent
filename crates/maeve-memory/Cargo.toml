[package]
name = "maeve-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
