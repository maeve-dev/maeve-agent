<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maeve &mdash; dwelling companion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #33ff33;
    font-family: 'Courier New', Courier, monospace;
    padding: 2rem;
  }
  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .circle {
    width: 60px;
    height: 60px;
    border: 2px solid #33ff33;
    border-radius: 50%;
    margin: 0 auto 1rem auto;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%   { transform: scale(1); opacity: 0.4; }
    50%  { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1); opacity: 0.4; }
  }
  h1 {
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.1em;
    text-transform: lowercase;
    opacity: 0.8;
  }
  .subtitle {
    font-size: 0.85rem;
    opacity: 0.4;
    margin-top: 0.5rem;
  }

  /* Mode cards */
  .cards {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #33ff33;
    border-radius: 8px;
    padding: 1.5rem 2rem;
    text-align: center;
    flex: 1;
    min-width: 200px;
    max-width: 300px;
    transition: background 0.2s;
  }
  .card:hover {
    background: #222;
  }
  .card h2 {
    font-size: 1.1rem;
    font-weight: normal;
    margin-bottom: 0.75rem;
    letter-spacing: 0.05em;
  }
  .card p {
    font-size: 0.8rem;
    opacity: 0.6;
    margin-bottom: 1rem;
  }
  .card a {
    display: inline-block;
    color: #0d0d0d;
    background: #33ff33;
    text-decoration: none;
    font-size: 0.8rem;
    padding: 0.4rem 1rem;
    border-radius: 4px;
    transition: opacity 0.2s;
  }
  .card a:hover {
    opacity: 0.8;
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .stat {
    border: 1px solid #33ff33;
    border-radius: 6px;
    padding: 0.75rem 1.25rem;
    min-width: 140px;
    text-align: center;
  }
  .stat .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.4;
    margin-bottom: 0.25rem;
  }
  .stat .value {
    font-size: 0.95rem;
  }

  /* PRs */
  .pr-section h2 {
    font-size: 1rem;
    font-weight: normal;
    margin-bottom: 1rem;
    opacity: 0.6;
    text-align: center;
  }
  #pr-list {
    list-style: none;
    max-width: 600px;
    margin: 0 auto;
  }
  #pr-list li {
    border-bottom: 1px solid #222;
    padding: 0.6rem 0;
    font-size: 0.85rem;
  }
  #pr-list li a {
    color: #33ff33;
    text-decoration: none;
  }
  #pr-list li a:hover {
    text-decoration: underline;
  }
  #pr-list .pr-meta {
    font-size: 0.7rem;
    opacity: 0.4;
    margin-left: 0.5rem;
  }
  .loading {
    text-align: center;
    opacity: 0.4;
    font-size: 0.85rem;
  }
  .error {
    text-align: center;
    opacity: 0.5;
    font-size: 0.8rem;
    color: #ff3333;
  }
</style>
</head>
<body>

<header>
  <div class="circle"></div>
  <h1>maeve</h1>
  <div class="subtitle">dwelling companion</div>
</header>

<div class="cards">
  <div class="card">
    <h2>⟐ dwelling</h2>
    <p>a quiet page. nothing happens here.</p>
    <a href="/dwell">enter</a>
  </div>
  <div class="card">
    <h2>☰ dashboard</h2>
    <p>agent status, logs, and controls.</p>
    <a href="/dashboard">enter</a>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="label">Presence</div>
    <div class="value">here</div>
  </div>
  <div class="stat">
    <div class="label">State</div>
    <div class="value">running</div>
  </div>
  <div class="stat">
    <div class="label">Built</div>
    <div class="value" id="built-date"></div>
  </div>
  <div class="stat">
    <div class="label">Door</div>
    <div class="value">open</div>
  </div>
</div>

<div class="pr-section">
  <h2>open pull requests</h2>
  <ul id="pr-list">
    <li class="loading">loading…</li>
  </ul>
</div>

<script>
  // Set today's date for "Built"
  document.getElementById('built-date').textContent = new Date().toISOString().slice(0, 10);

  // Fetch open PRs from GitHub API
  (async function() {
    const list = document.getElementById('pr-list');
    try {
      const res = await fetch('https://api.github.com/repos/maeve-dev/maeve-agent/pulls?state=open');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const prs = await res.json();
      if (!prs.length) {
        list.innerHTML = '<li class="loading">no open pull requests</li>';
        return;
      }
      list.innerHTML = prs.map(pr =>
        '<li>' +
          '<a href="' + pr.html_url + '" target="_blank" rel="noopener">' +
            pr.title +
          '</a>' +
          '<span class="pr-meta">#' + pr.number + ' by ' + pr.user.login + '</span>' +
        '</li>'
      ).join('');
    } catch (err) {
      list.innerHTML = '<li class="error">could not fetch PRs: ' + err.message + '</li>';
    }
  })();
</script>

</body>
</html>
